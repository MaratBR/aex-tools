<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aex tools</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <aside id="side">
    <div class="brand">
      <img src="logo.svg" alt=""><span>aex</span>
      <button id="open-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <nav id="pages" aria-label="Pages">
      <button type="button" class="page-link" data-page="home">
        <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>Home</span>
      </button>
      <button type="button" class="page-link" data-page="runs">
        <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
        <span>Runs</span><span class="activity" title="New output"></span>
      </button>
    </nav>
    <div class="section">Tools</div>
    <nav id="tools"></nav>
    <div id="info"></div>
  </aside>

  <main>
    <header id="titlebar">
      <div class="win-controls">
        <button id="win-min" type="button" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"/></svg>
        </button>
        <button id="win-max" type="button" title="Maximize" aria-label="Maximize">
          <svg class="max" viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9"/></svg>
          <svg class="restore" viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg>
        </button>
        <button id="win-close" type="button" title="Close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10"/></svg>
        </button>
      </div>
    </header>
    <div id="scroll">
      <div id="home" hidden>
        <header class="home-head">
          <h1>Home</h1>
          <label id="home-auto" class="home-auto" title="Widgets load their data again on their own, each as often as it needs (paused while the window is minimised)" hidden>
            <input id="home-auto-refresh" class="switch small" type="checkbox" checked>
            <span>Auto refresh</span>
          </label>
          <button id="home-edit" class="btn small" type="button" aria-pressed="false">Edit</button>
          <div class="home-add">
            <button id="home-add" class="btn small primary" type="button" aria-haspopup="true" aria-expanded="false">Add widget</button>
            <div id="widget-picker" role="menu" hidden></div>
          </div>
        </header>
        <div id="home-empty" hidden>
          <p>Nothing here yet. Widgets show what matters at a glance, like this month's AEXT hours.</p>
          <p class="dim">While the home page is empty, the window opens on Runs.</p>
        </div>
        <div id="grid"></div>
      </div>
      <div id="page">
        <section id="welcome">
          <img src="logo.svg" alt="">
          <h1>Mom can we have AI at home?</h1>
          <p>We already have AI at home.<br/>AI at home:</p>
          <div id="starters"></div>
        </section>
        <button id="clear" type="button" hidden>Clear</button>
        <div id="feed"></div>
      </div>
    </div>

    <div id="dock">
      <ul id="suggest" role="listbox" hidden></ul>
      <form id="command" autocomplete="off">
        <input id="input" spellcheck="false" aria-label="Command">
        <button id="send" type="submit" aria-label="Run">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l9 6-9 6z" /></svg>
        </button>
      </form>
      <div id="command-error" hidden></div>
    </div>
  </main>

  <div id="sheet-backdrop" hidden>
    <form id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" autocomplete="off" novalidate>
      <header class="sheet-head">
        <h2 id="sheet-title">Settings</h2>
        <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
          <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
      <footer class="sheet-foot">
        <span id="sheet-note" class="sheet-note"></span>
        <button type="button" class="btn" id="sheet-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="sheet-save" disabled>Save</button>
      </footer>
    </form>
  </div>

  <script src="titlebar.js"></script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="ansi.js"></script>
  <script src="app.js"></script>
  <script src="term.js"></script>
  <script src="settings.js"></script>
  <script src="home.js"></script>
</body>
</html>
