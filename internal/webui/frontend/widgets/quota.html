<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AEXT quota</title>
  <style>
    body { display: flex; flex-direction: column; padding: 14px 16px 14px; gap: 10px; }
    .head { display: flex; align-items: center; gap: 8px; }
    .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title .muted { font-weight: 400; }
    .loading #refresh svg { animation: spin .9s linear infinite; }
    .icon-btn:disabled { opacity: .35; cursor: default; background: none; }
    .now { padding: 1px 8px; border: 0; border-radius: 999px; background: var(--fill); color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .now:hover { background: var(--hover); color: var(--ink); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .logged { font: 700 34px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .of { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
    .verdict { margin-left: auto; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .verdict.good { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
    .verdict.bad { color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, transparent); }
    .verdict.near { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
    .verdict.neutral { color: var(--muted); background: var(--fill); }

    /* The month's weekdays, one slot each: working days fill with the hours logged, in order, at a
       day's hours each; leave (approved green, pending blue) and holidays are hatched and skipped.
       A marker shows where the hours due by today end. */
    :root { --approved: var(--ok); --pending: var(--c12); --holiday: var(--faint); }
    .bar { position: relative; }
    .track { display: flex; height: 10px; border-radius: 10px; overflow: hidden; background: var(--fill); }
    .slot { flex: 1; position: relative; min-width: 0; }
    .slot .fill { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width .4s ease; }
    .bar.bad .slot .fill { background: var(--fail); }
    .bar.near .slot .fill { background: var(--warn); }
    .slot.off { --c: var(--holiday); background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--c) 70%, transparent) 0 2px, color-mix(in srgb, var(--c) 28%, transparent) 2px 4px); }
    .slot.approved { --c: var(--approved); }
    .slot.pending { --c: var(--pending); }
    .slot.off + .slot:not(.off), .slot:not(.off) + .slot.off { margin-left: 1px; }
    .bar .due { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--warn); }

    .period { margin-right: 10px; }
    .sw { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 2px; background: var(--c, var(--holiday)); vertical-align: 0; }
    .sw.approved { --c: var(--approved); }
    .sw.pending { --c: var(--pending); }
    .offwork { color: var(--warn); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; min-height: 0; overflow: hidden; }
    .rows dt { color: var(--muted); white-space: nowrap; }
    .rows dd { margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .strong { font-weight: 600; }
    .over { color: var(--warn); font-weight: 600; }
    .missing { color: var(--warn); }
    .match { color: var(--ok); }

    .last { margin-top: auto; display: flex; align-items: baseline; gap: 8px; padding-top: 10px; font-size: 13px; box-shadow: inset 0 .5px 0 var(--sep); }
    .last .name { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .last .good { color: var(--ok); font-weight: 600; }
    .last .bad { color: var(--fail); font-weight: 600; }
    .last .near { color: var(--warn); font-weight: 600; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Loading: grey blocks where the numbers, bar and rows go. */
    .sk { display: block; border-radius: 6px; background: var(--fill); animation: pulse 1.4s ease-in-out infinite; }
    .sk-rows { display: flex; flex-direction: column; gap: 7px; min-height: 0; overflow: hidden; }
    @keyframes pulse { 50% { opacity: .45; } }

    .notice { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 13px; }
    .notice .error { color: var(--fail); overflow-wrap: anywhere; max-height: 5.5em; overflow: hidden; }

    /* One row high: the numbers and the bar only. */
    @media (max-height: 200px) {
      body { gap: 8px; padding-top: 12px; }
      .rows, .last, .actions, .offwork, .sk-rows { display: none; }
      .logged { font-size: 28px; }
    }
    @media (max-height: 330px) { .rows .extra { display: none; } }
    @media (max-width: 300px) { .of .pct { display: none; } }

    /* How it is counted (the popup): the month as a calendar, each day by how it counts, the sums made
       of them, and under Details everything the quota was computed from. */
    .dbg { display: flex; flex-direction: column; gap: 12px; font-size: 12px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal .wd { color: var(--muted); font-size: 11px; text-align: center; }
    .cell { --c: var(--ok); position: relative; min-height: 50px; padding: 4px 6px; border-radius: 6px; overflow: hidden;
      background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent);
      display: flex; flex-direction: column; justify-content: space-between; cursor: default; }
    .cell .n { font-weight: 600; font-variant-numeric: tabular-nums; }
    .cell .hrs { align-self: flex-end; font-variant-numeric: tabular-nums; position: relative; }
    .cell .lbl { position: absolute; top: 5px; right: 6px; font-size: 10px; color: var(--muted); max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell .fill { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--c) 22%, transparent); }
    .cell.st-upcoming { --c: var(--muted); background: none; box-shadow: inset 0 0 0 1px var(--sep); }
    .cell.st-missing { --c: var(--warn); }
    .cell.st-today { box-shadow: inset 0 0 0 2px var(--warn); }
    .cell.st-approved, .cell.st-pending, .cell.st-holiday { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--c) 26%, transparent) 0 2px, color-mix(in srgb, var(--c) 8%, transparent) 2px 6px); }
    .cell.st-approved { --c: var(--approved); }
    .cell.st-pending { --c: var(--pending); }
    .cell.st-holiday { --c: var(--holiday); }
    .cell.st-weekend { --c: var(--faint); background: none; box-shadow: none; color: var(--faint); }
    .cell.st-nocal { --c: var(--fail); background: none; box-shadow: none; outline: 1px dashed var(--fail); outline-offset: -1px; }
    .cell.st-offhours .hrs { color: var(--warn); font-weight: 600; }
    .cell.blank { background: none; box-shadow: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .legend .sw2 { display: inline-block; width: 12px; height: 12px; margin-right: 5px; border-radius: 3px; vertical-align: -2px; }
    .legend .muted { margin-left: 4px; }
    .sum { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
    .sum .t { display: flex; flex-direction: column; padding: 5px 9px; border-radius: 6px; background: var(--fill); }
    .sum .t b { font: 600 16px/1.2 var(--display); font-variant-numeric: tabular-nums; }
    .sum .t span { color: var(--muted); font-size: 11px; }
    .sum .t.res { background: color-mix(in srgb, var(--ok) 13%, transparent); }
    .sum .t.res.bad { background: color-mix(in srgb, var(--fail) 12%, transparent); }
    .sum .t.res.near { background: color-mix(in srgb, var(--warn) 13%, transparent); }
    .sum .op { align-self: center; color: var(--muted); font-size: 15px; }
    .rules { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.5; }
    .dbg details.more > summary { cursor: pointer; color: var(--muted); font-weight: 600; }
    .dbg details.more[open] > summary { margin-bottom: 10px; }
    .dbg details.more > div { display: flex; flex-direction: column; gap: 12px; }
    .dbg h3 { margin: 4px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .dbg .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; }
    .dbg .kv dt { color: var(--muted); }
    .dbg .kv dd, .dbg td { margin: 0; font-family: var(--mono, ui-monospace, monospace); }
    .dbg .kv dd { overflow-wrap: anywhere; }
    .dbg .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .dbg table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .dbg th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: .5px solid var(--sep); padding: 2px 6px; }
    .dbg td { padding: 1px 6px; white-space: nowrap; }
    .dbg tr.weekend td, .dbg tr.holiday td { color: var(--faint); }
    .dbg tr.leave td { color: var(--c12); }
    .dbg tr.today td { box-shadow: inset 2px 0 var(--warn); }
    .dbg tr.ignored td { text-decoration: line-through; color: var(--faint); }
    .dbg .flag { color: var(--warn); }
    .dbg pre { margin: 0; max-height: 360px; overflow: auto; padding: 8px; border-radius: 6px; background: var(--fill); font-size: 11px; }
    /* The popup's month selector: ‹ month ▾ ›, This / Last month, when it loaded and Reload, with a
       bar under it running while a month loads (what was shown stays, faded, so nothing jumps). */
    .dbg .top { position: relative; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-bottom: 10px; box-shadow: inset 0 -.5px 0 var(--sep); }
    .dbg button { transition: background-color .15s, color .15s, transform .12s ease; }
    .dbg button:active:not(:disabled) { transform: scale(.93); }
    .dbg .icon-btn:disabled { opacity: .35; cursor: default; background: none; }
    .dbg .icon-btn svg { transition: transform .15s ease; }
    .dbg .back:hover:not(:disabled) svg { transform: translateX(-2px); }
    .dbg .fwd:hover:not(:disabled) svg { transform: translateX(2px); }
    .mnav { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; background: var(--fill-2); }
    .mbtn { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 156px; padding: 4px 12px; border: 0; border-radius: 999px; background: none;
      font: 600 13px/18px var(--sans); font-variant-numeric: tabular-nums; cursor: pointer; }
    .mbtn:hover:not(:disabled), .mbtn[aria-expanded="true"] { background: var(--hover); }
    .mbtn:disabled { cursor: default; color: var(--muted); }
    .mbtn svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .18s ease; }
    .mbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
    .chips { display: flex; gap: 4px; }
    .chip { padding: 3px 10px; border: 0; border-radius: 999px; background: var(--fill); color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; }
    .chip:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
    .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); font-weight: 600; }
    .chip:disabled { opacity: .5; cursor: default; }
    .stamp { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .dbg.loading #reload svg { animation: spin .9s linear infinite; }
    .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; border-radius: 2px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .progress::before { content: ''; position: absolute; top: 0; bottom: 0; left: -35%; width: 35%; border-radius: 2px; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
    .dbg.loading .progress { opacity: 1; }
    @keyframes slide { to { left: 100%; } }
    .dbg .body { display: flex; flex-direction: column; gap: 12px; transition: opacity .2s; }
    .dbg.loading .body { opacity: .5; }
    .dbg .body.in-next { animation: in-next .22s ease-out; }
    .dbg .body.in-prev { animation: in-prev .22s ease-out; }
    @keyframes in-next { from { opacity: 0; transform: translateX(14px); } }
    @keyframes in-prev { from { opacity: 0; transform: translateX(-14px); } }
    .dbg .cal .sk { height: 50px; }
    /* The month picker: a year with ‹ ›, its months; this month outlined, the one shown filled. */
    .picker { position: absolute; top: calc(100% + 4px); left: 0; z-index: 5; width: 256px; padding: 10px; border-radius: 12px; background: var(--surface);
      box-shadow: var(--pop-shadow); transform-origin: top left; animation: pop .14s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
    .picker .yr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .picker .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .picker .m { padding: 7px 0; border: 0; border-radius: 8px; background: none; font-size: 13px; cursor: pointer; }
    .picker .m:hover { background: var(--hover); }
    .picker .m.now { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
    .picker .m[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="head">
    <div class="title">AEXT quota <span class="muted" id="month"></span></div>
    <button class="now" id="now" type="button" title="Back to this month" hidden>This month</button>
    <button class="icon-btn" id="prev" type="button" title="Previous month" aria-label="Previous month" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="next" type="button" title="Next month" aria-label="Next month" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn" id="debug" type="button" title="How it is counted" aria-label="How it is counted">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
    <button class="icon-btn" id="refresh" type="button" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
  <div id="content"></div>

  <script>
    // A month's AEXT hours against the quota (this month by default, ‹ › for others), and the month
    // before it: the quota tool's numbers (home.go: quotaAPI), laid out for a glance.
    const content = document.getElementById('content');
    const epsilon = 0.05; // below this a difference is rounding, not hours to log (as in quota.go)
    let warnHours = 1; // a month over short by less than this is a warning, not a failure (QUOTA_WARN_HOURS)
    const maxAhead = 12; // months after this one › goes to

    const h = n => (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '') + 'h';
    const dayOf = d => new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
    const monthName = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' });
    const shortDay = d => dayOf(d).toLocaleString('en', { weekday: 'short' }) + ' ' + d.slice(5, 7) + '.' + d.slice(8, 10);
    const plural = (n, one, many) => (n === 1 ? '1 ' + one : n + ' ' + many);
    const addMonths = (ym, n) => {
      const t = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1);
      return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0');
    };
    const rangeDay = d => d.replaceAll('-', '.'); // 2026.09.20, as worklog-sync's --range takes it
    // Where Sync starts: the first of this month, or a week before it until the 10th.
    function syncFrom(today) {
      const first = today.slice(0, 8) + '01';
      if (Number(today.slice(8)) >= 10) return first;
      const d = new Date(first + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() - 7);
      return d.toISOString().slice(0, 10);
    }

    function node(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    const shortCls = q => (q.remaining < warnHours ? 'near' : 'bad');

    // Hours still to log today for a full day: 0 when today is not a working day.
    const todayLeft = (q, r) =>
      q.days.some(d => d.date === r.today && d.kind === 'work') ? Math.max(0, r.hoursPerDay - q.today) : 0;

    function verdict(q, r) {
      if (q.future) return { cls: 'neutral', text: 'Upcoming' };
      if (q.remaining <= epsilon) return { cls: 'good', text: q.current ? 'Quota filled' : 'Complete' };
      if (!q.current) return { cls: shortCls(q), text: h(q.remaining) + ' short' };
      // Behind only by what is left of today: a full day today catches up.
      if (q.behind > epsilon) return { cls: q.behind <= todayLeft(q, r) + epsilon ? 'near' : 'bad', text: h(q.behind) + ' behind' };
      if (q.behind < -epsilon) return { cls: 'good', text: h(-q.behind) + ' ahead' };
      return { cls: 'good', text: 'On track' };
    }

    // What a day off is: its class on the bar and its name; null for a working day or a weekend.
    function offKind(d) {
      if (d.kind === 'leave') {
        const type = (d.leave.type || 'leave').replaceAll('_', ' ');
        return { cls: d.leave.approved ? 'approved' : 'pending', name: d.leave.approved ? type : type + ' (pending)' };
      }
      if (d.kind === 'holiday') return { cls: 'holiday', name: 'holiday' };
      return null;
    }

    function bar(q, r, cls) {
      const b = node('div', 'bar ' + cls);
      const track = node('div', 'track');
      const slots = q.days.filter(d => d.kind !== 'weekend');
      let left = q.logged, worked = 0, due = -1;
      slots.forEach((d, i) => {
        const s = node('div', 'slot');
        const off = offKind(d);
        let title = shortDay(d.date) + ' · ' + (off ? off.name : 'working day');
        if (off) s.className += ' off ' + off.cls;
        else {
          const f = r.hoursPerDay > 0 ? Math.max(0, Math.min(1, left / r.hoursPerDay)) : 0;
          left -= r.hoursPerDay;
          const fill = node('div', 'fill');
          fill.style.width = f * 100 + '%';
          s.appendChild(fill);
          if (++worked === q.daysDue) due = i + 1;
        }
        if (d.hours) title += ' · ' + h(d.hours) + ' logged';
        s.title = title;
        track.appendChild(s);
      });
      b.appendChild(track);
      if (q.current && q.daysLeft > 0 && q.expectedToDate > q.logged && due > 0) {
        const m = node('div', 'due');
        m.style.left = (due / slots.length) * 100 + '%';
        m.title = h(q.expectedToDate) + ' due by today';
        b.appendChild(m);
      }
      b.setAttribute('role', 'img');
      b.setAttribute('aria-label', `${h(q.logged)} of ${h(q.expected)} logged`);
      return b;
    }

    // Leave and holidays as periods: days in a row of the same kind, weekends between them included.
    function periods(q) {
      const list = [];
      let run = null;
      for (const d of q.days) {
        if (d.kind === 'weekend') continue;
        const off = offKind(d);
        const key = off && off.cls + ':' + off.name;
        if (run && key === run.key) run.to = d.date;
        else {
          run = off ? { key, ...off, from: d.date, to: d.date } : null;
          if (run) list.push(run);
        }
      }
      return list;
    }

    function periodText(p) {
      const month = dayOf(p.from).toLocaleString('en', { month: 'short' });
      const days = p.from === p.to ? +p.from.slice(8) : `${+p.from.slice(8)}–${+p.to.slice(8)}`;
      return `${month} ${days} ${p.name}`;
    }

    // Hours logged on leave days and on weekends and holidays (quota.go: OffWork).
    function offWork(q) {
      const parts = [];
      if (q.leaveHours > epsilon) parts.push(h(q.leaveHours) + ' during your off time');
      if (q.offDayHours > epsilon) parts.push(h(q.offDayHours) + ' on non-working days');
      return parts.length ? 'You worked ' + parts.join(' and ') : '';
    }

    function row(list, label, value, cls) {
      list.append(node('dt', cls, label));
      const dd = node('dd', cls);
      dd.append(...[].concat(value));
      list.append(dd);
      return dd;
    }

    function render(r) {
      content.removeAttribute('aria-busy');
      const [q, last] = r.months;
      warnHours = r.warnHours ?? 1;
      document.getElementById('month').textContent = '· ' + monthName(q.month);
      content.textContent = '';
      content.style.display = 'contents';

      const v = verdict(q, r);
      const big = node('div', 'big');
      big.append(node('span', 'logged', h(q.logged)));
      const of = node('span', 'of', '/ ' + h(q.expected) + ' ');
      of.append(node('span', 'pct', `· ${Math.round(q.percent)}%`));
      big.append(of, node('span', 'verdict ' + v.cls, v.text));
      content.append(big, bar(q, r, v.cls));

      const warn = offWork(q);
      if (warn) {
        const w = node('div', 'offwork', '▲ ' + warn);
        w.title = warn;
        content.append(w);
      }

      const rows = node('dl', 'rows');
      if (q.current) row(rows, 'Today', q.today > 0 ? h(q.today) + ' logged' : node('span', 'muted', 'nothing logged yet'));
      if (q.current) checkRow(rows);
      const off = periods(q);
      if (off.length) {
        const list = off.map(p => {
          const e = node('span', 'period');
          e.append(node('span', 'sw ' + p.cls), periodText(p));
          return e;
        });
        row(rows, 'Off', list).title = off.map(periodText).join('\n');
      }
      if (q.current) {
        row(rows, 'Due by today', [h(q.expectedToDate) + ' ', node('span', 'muted', `(${q.daysDue} of ${q.workingDays} days)`)]);
        if (q.daysLeft > 0 && q.remaining > epsilon) {
          const need = node('span', q.perDayLeft > r.hoursPerDay + epsilon ? 'over' : 'strong', h(q.perDayLeft) + '/day');
          row(rows, 'To finish', [need, ` over ${plural(q.daysLeft, 'day', 'days')} left`]);
        }
      }
      const missing = q.missing || [];
      if (missing.length) {
        const shown = missing.slice(0, 4).map(shortDay).join(', ') + (missing.length > 4 ? ` +${missing.length - 4}` : '');
        row(rows, 'Missing', shown, 'missing').title = missing.map(shortDay).join(', ');
      }
      let expected = `${plural(q.workingDays, 'working day', 'working days')} × ${h(r.hoursPerDay)}`;
      if (q.leaveDays > 0) expected += ` · ${plural(q.leaveDays, 'day', 'days')} on leave`;
      row(rows, 'Expected', node('span', 'muted', expected), 'extra');
      content.append(rows);

      // Sync is this month through today, plus the last week of last month before the 10th; a past
      // month syncs its missing days.
      const actions = node('div', 'actions');
      const action = (label, primary, line, title) => {
        const b = node('button', 'btn' + (primary ? ' primary' : ''), label);
        b.type = 'button';
        if (title) b.title = title;
        b.onclick = () => aex.run(line);
        actions.append(b);
      };
      if (q.current) {
        if (missing.length) action('Run worklog-sync', true, 'worklog-sync');
        const from = syncFrom(r.today);
        action('Sync', !missing.length || hasDiffs(), `worklog-sync --range "${rangeDay(from)}-${rangeDay(r.today)}"`,
          `Sync ${shortDay(from)} – ${shortDay(r.today)} from Jira to AEXT`);
      } else if (missing.length) {
        action('Sync missing days', true, `worklog-sync --range "${rangeDay(missing[0])}-${rangeDay(missing[missing.length - 1])}"`);
      }
      if (actions.childElementCount) content.append(actions);

      // The month before, when it is over.
      if (last.current || last.future) return;
      const foot = node('div', 'last');
      foot.append(node('span', 'name', monthName(last.month)));
      if (last.remaining <= epsilon) foot.append(node('span', 'good', '✔ complete'), node('span', 'muted', `${h(last.logged)} / ${h(last.expected)}`));
      else foot.append(node('span', shortCls(last), '✖ ' + h(last.remaining) + ' short'), node('span', 'muted', `${h(last.logged)} / ${h(last.expected)}`));
      const tip = [offWork(last), ...(r.warnings || [])].filter(Boolean);
      if (tip.length) foot.title = tip.join('\n');
      content.append(foot);
    }

    // This week in Jira against AEXT (home.go: worklogCheckAPI): its row under Today, shown with this
    // month only. Nothing while it loads the first time, or without a Jira login.
    let check = null, checkError = '';
    const hasDiffs = () => !!(check && check.diffs && check.diffs.length);

    function diffText(d) {
      const side = n => (n > 0 ? h(n) : '—');
      return `${shortDay(d.date)} ${d.issue}: Jira ${side(d.jira)}, AEXT ${side(d.aext)}`;
    }

    function checkRow(rows) {
      if (checkError) {
        row(rows, 'Jira week', node('span', 'muted', 'could not check')).title = checkError;
        return;
      }
      if (!check || check.notConfigured || check.noSession) return;
      if (check.needLogin) {
        row(rows, 'Jira week', node('span', 'muted', 'Jira rejects the token')).title = 'account --login jira';
        return;
      }
      const span = `${shortDay(check.from)} – ${shortDay(check.to)}`;
      if (!hasDiffs()) {
        row(rows, 'Jira week', [node('span', 'match', '✔ matches AEXT'), node('span', 'muted', ` · ${h(check.jira)}`)]).title =
          `${span}: ${h(check.jira)} in Jira, the same in AEXT`;
        return;
      }
      const n = check.diffs.length;
      const gap = check.jira - check.aext;
      let text = plural(n, 'difference', 'differences');
      if (Math.abs(gap) > epsilon) text += ` · Jira ${gap > 0 ? '+' : '−'}${h(Math.abs(gap))}`;
      row(rows, 'Jira week', [node('span', 'over', '▲ ' + text), node('span', 'muted', ` (Jira ${h(check.jira)}, AEXT ${h(check.aext)})`)]).title =
        `${span}, Jira against AEXT:\n` + check.diffs.map(diffText).join('\n');
    }

    let checkSeq = 0;
    async function loadCheck(fresh) {
      const n = ++checkSeq;
      try {
        const r = await aex.call('worklogCheck', fresh ? { fresh: true } : {});
        if (n !== checkSeq) return;
        check = r;
        checkError = '';
      } catch (e) {
        if (n !== checkSeq) return;
        checkError = e.message;
      }
      const r = !offset && cache.get(thisMonth);
      if (r && shown) render(r);
    }

    // skeleton stands in for the quota while the first reply (or a month not loaded yet) comes.
    function skeleton() {
      content.textContent = '';
      content.className = '';
      content.style.display = 'contents';
      const block = (w, h, cls) => {
        const e = node('span', 'sk' + (cls ? ' ' + cls : ''));
        e.style.width = w;
        e.style.height = h + 'px';
        return e;
      };
      const big = node('div', 'big');
      const pill = block('72px', 20);
      pill.style.marginLeft = 'auto';
      pill.style.borderRadius = '999px';
      big.append(block('84px', 34), block('70px', 15), pill);
      const rows = node('div', 'sk-rows');
      rows.append(block('62%', 13), block('48%', 13), block('55%', 13));
      const foot = node('div', 'last');
      foot.append(block('40%', 13));
      content.append(big, block('100%', 10), rows, foot);
      content.setAttribute('aria-busy', 'true');
    }

    function notice(text, error, action) {
      content.removeAttribute('aria-busy');
      content.textContent = '';
      content.style.display = '';
      content.className = 'notice';
      content.append(node('div', null, text));
      if (error) content.append(node('div', 'error', error));
      if (action) {
        const b = node('button', 'btn primary', action.label);
        b.type = 'button';
        b.onclick = action.run;
        content.append(b);
      }
    }

    // The month shown is kept as months from this one, so it follows when the month turns. This
    // month (YYYY-MM) is known from the first reply; until then ‹ › are off.
    const debugBtn = document.getElementById('debug');
    let offset = 0, thisMonth = '', seq = 0, shown = false;
    const cache = new Map(); // month → its last reply, shown at once when going back to it
    const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next'), nowBtn = document.getElementById('now');
    const shownMonth = () => (offset ? addMonths(thisMonth, offset) : thisMonth);

    function updateNav() {
      prevBtn.disabled = !thisMonth;
      nextBtn.disabled = !thisMonth || offset >= maxAhead;
      nowBtn.hidden = !offset;
    }

    function go(n) {
      offset = n;
      updateNav();
      const r = cache.get(shownMonth());
      shown = !!r;
      if (r) {
        content.className = '';
        render(r);
      }
      load();
    }

    async function load() {
      const n = ++seq;
      document.body.classList.add('loading');
      if (!shown) skeleton();
      try {
        const r = await aex.call('quota', offset ? { month: shownMonth() } : {});
        if (n !== seq) return;
        if (r.needLogin) {
          shown = false;
          cache.clear();
          document.getElementById('month').textContent = '';
          notice('Not logged in to AEXT.', '', { label: 'Log in', run: () => aex.run('account --login aext') });
        } else {
          if (!offset) thisMonth = r.today.slice(0, 7);
          cache.set(r.months[0].month, r);
          content.className = '';
          render(r);
          shown = true;
        }
      } catch (e) {
        if (n !== seq) return;
        shown = false;
        notice('Could not load the quota.', e.message, { label: 'Try again', run: load });
      } finally {
        if (n === seq) {
          document.body.classList.remove('loading');
          updateNav();
        }
      }
    }

    // How it is counted: the ⓘ button opens the month shown in a popup, which loads it again itself with
    // debug (home.go: QuotaDebug), on Reload and on every refresh.
    debugBtn.onclick = () => aex.openPopup({ title: 'AEXT quota · how it is counted', width: 760, data: { month: offset ? shownMonth() : '' } }).catch(() => {});

    let moreOpen = false; // Details open
    const weekdayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    // How each day counts toward the quota, for the calendar's cells and its legend.
    const statuses = {
      logged: { label: 'Counted, logged', why: 'A working day in the AEXT calendar: it counts toward the quota' },
      missing: { label: 'Counted, nothing logged', why: 'A working day before today with no hours: a missing day' },
      today: { label: 'Today', why: 'Counted and due already: until its hours are logged it counts as behind' },
      upcoming: { label: 'Counted, still to come', why: 'A working day after today: in the quota, not due yet' },
      approved: { label: 'Leave', why: 'Approved leave on a working day: taken out of the quota' },
      pending: { label: 'Leave, pending', why: 'Leave not approved yet: taken out of the quota like approved leave (with a warning)' },
      holiday: { label: 'Holiday', why: 'A weekday the AEXT calendar has as not working: not in the quota' },
      weekend: { label: 'Weekend', why: 'Not working in the AEXT calendar: not in the quota' },
      nocal: { label: 'Not in calendar', why: 'The AEXT calendar has no entry for this day: not in the quota' },
    };
    const swatch = { logged: 'var(--ok)', missing: 'var(--warn)', today: 'var(--warn)', upcoming: 'var(--sep)', approved: 'var(--approved)',
      pending: 'var(--pending)', holiday: 'var(--holiday)', weekend: 'var(--fill)', nocal: 'var(--fail)' };

    function dayStatus(day, r, d, calendar) {
      if (!calendar.has(day.date)) return 'nocal';
      if (day.kind === 'leave') return day.leave.approved ? 'approved' : 'pending';
      if (day.kind === 'holiday' || day.kind === 'weekend') return day.kind;
      if (!d.workingDays[day.date]) return 'nocal';
      if (day.date === r.today) return 'today';
      if (day.date > r.today) return 'upcoming';
      return day.hours > 0 ? 'logged' : 'missing';
    }

    // explain draws the month q: a calendar of its days by how each counts, a legend with how many of
    // each, how the working days and hours add up, and the rules behind them.
    function explain(dbg, r, q) {
      const d = r.debug, raw = d.raw;
      const calendar = new Map((raw.workingDays || []).map(w => [w.date, w.is_working_day]));
      const ignored = new Set(d.ignoredStatuses || []);
      const ignoredOn = date => (raw.leaves || []).filter(l => ignored.has(l.status) && l.start <= date && date <= l.end);
      const counts = {};
      let weekdays = 0, holidays = 0, noCal = 0, workWeekend = 0, leave = 0;

      const cal = node('div', 'cal');
      for (const w of weekdayNames) cal.append(node('div', 'wd', w));
      const days = q.days || [];
      const lead = days.length ? (dayOf(days[0].date).getDay() + 6) % 7 : 0;
      for (let i = lead; i > 0; i--) cal.append(node('div', 'cell blank'));
      for (const day of days) {
        const s = dayStatus(day, r, d, calendar);
        counts[s] = (counts[s] || 0) + 1;
        const wd = dayOf(day.date).getDay();
        const weekday = wd !== 0 && wd !== 6;
        const working = calendar.get(day.date) === true;
        if (weekday) weekdays++;
        if (weekday && calendar.get(day.date) === false) holidays++;
        if (weekday && !calendar.has(day.date)) noCal++;
        if (!weekday && working) workWeekend++;
        if (day.kind === 'leave') leave++;

        const c = node('div', 'cell st-' + s);
        const off = s !== 'logged' && s !== 'missing' && s !== 'today' && s !== 'upcoming';
        if (day.hours && off) c.classList.add('st-offhours');
        c.append(node('span', 'n', String(+day.date.slice(8))));
        const label = day.leave ? (day.leave.type || 'leave').replaceAll('_', ' ') : s === 'holiday' ? 'holiday' : s === 'nocal' ? 'no entry' : !weekday && working ? 'working' : '';
        if (label) c.append(node('span', 'lbl', label));
        if (day.hours) {
          if (!off && r.hoursPerDay > 0) {
            const f = node('div', 'fill');
            f.style.height = Math.min(1, day.hours / r.hoursPerDay) * 100 + '%';
            c.append(f);
          }
          c.append(node('span', 'hrs', h(day.hours)));
        }
        const tip = [shortDay(day.date) + ' · ' + statuses[s].label, statuses[s].why];
        if (!weekday && working) tip.push('A weekend day the AEXT calendar has as working');
        if (day.leave) tip.push('Leave: ' + (day.leave.type || '?') + (day.leave.approved ? ', approved' : ', pending'));
        for (const l of ignoredOn(day.date)) tip.push(`Ignored ${l.status} leave (${l.leave_type || '?'})`);
        if (day.hours) tip.push(h(day.hours) + ' logged' + (off ? ': counts toward logged, though the day is off' : ''));
        else if (s === 'missing') tip.push('Nothing logged');
        c.title = tip.join('\n');
        cal.append(c);
      }
      // Always six weeks, so the popup keeps its height from month to month.
      for (let i = lead + days.length; i < 42; i++) cal.append(node('div', 'cell blank'));
      dbg.append(cal);

      const legend = node('div', 'legend');
      for (const [s, info] of Object.entries(statuses)) {
        if (!counts[s]) continue;
        const e = node('span');
        e.title = info.why;
        const sw = node('span', 'sw2');
        if (s === 'approved' || s === 'pending' || s === 'holiday')
          sw.style.background = `repeating-linear-gradient(-45deg, ${swatch[s]} 0 2px, color-mix(in srgb, ${swatch[s]} 30%, transparent) 2px 4px)`;
        else if (s === 'today' || s === 'upcoming' || s === 'nocal') sw.style.boxShadow = `inset 0 0 0 ${s === 'today' ? 2 : 1}px ${swatch[s]}`;
        else sw.style.background = swatch[s];
        e.append(sw, info.label, node('span', 'muted', String(counts[s])));
        legend.append(e);
      }
      dbg.append(legend);

      // The working days: weekdays, less days off, plus working weekend days.
      const sum = (terms, result, cls) => {
        const e = node('div', 'sum');
        terms.forEach(([op, value, label], i) => {
          if (i) e.append(node('span', 'op', op));
          const t = node('div', 't');
          t.append(node('b', '', value), node('span', '', label));
          e.append(t);
        });
        e.append(node('span', 'op', '='));
        const t = node('div', 't res' + (cls ? ' ' + cls : ''));
        t.append(node('b', '', result[0]), node('span', '', result[1]));
        e.append(t);
        return e;
      };
      const terms = [['', String(weekdays), 'weekdays']];
      if (holidays) terms.push(['−', String(holidays), 'holidays']);
      if (noCal) terms.push(['−', String(noCal), 'not in calendar']);
      if (workWeekend) terms.push(['+', String(workWeekend), 'working weekend days']);
      if (leave) terms.push(['−', String(leave), 'leave days']);
      dbg.append(node('h3', '', 'Working days'), sum(terms, [String(q.workingDays), 'working days']));
      const made = weekdays - holidays - noCal + workWeekend - leave;
      if (made !== q.workingDays) dbg.append(node('div', 'flag', `▲ These add up to ${made}, but the quota counted ${q.workingDays}: see Details.`));

      dbg.append(node('h3', '', 'Hours'));
      dbg.append(sum([['', String(q.workingDays), 'working days'], ['×', h(r.hoursPerDay), 'per day (HOURS_PER_DAY)']], [h(q.expected), 'expected']));
      if (q.current) {
        dbg.append(sum([['', String(q.daysDue), 'days due, today included'], ['×', h(r.hoursPerDay), 'per day']], [h(q.expectedToDate), 'due by today']));
        const v = verdict(q, r);
        dbg.append(sum([['', h(q.expectedToDate), 'due by today'], ['−', h(q.logged), 'logged']],
          [h(Math.abs(q.behind)), q.behind > epsilon ? 'behind' : q.behind < -epsilon ? 'ahead' : 'on track'], v.cls === 'bad' ? 'bad' : v.cls === 'near' ? 'near' : ''));
        if (q.daysLeft > 0 && q.remaining > epsilon)
          dbg.append(sum([['', h(q.remaining), 'still to log'], ['÷', String(q.daysLeft), 'days left, today included']], [h(q.perDayLeft) + '/day', 'to finish']));
      } else if (!q.future) {
        dbg.append(sum([['', h(q.expected), 'expected'], ['−', h(q.logged), 'logged']],
          q.remaining <= epsilon ? ['✔', 'complete'] : [h(q.remaining), 'short'], q.remaining <= epsilon ? '' : shortCls(q)));
      }
      if (q.leaveHours > epsilon || q.offDayHours > epsilon) {
        const parts = [];
        if (q.leaveHours > epsilon) parts.push(h(q.leaveHours) + ' on leave days');
        if (q.offDayHours > epsilon) parts.push(h(q.offDayHours) + ' on weekends and holidays');
        dbg.append(node('div', 'flag', `▲ Logged includes ${parts.join(' and ')}: they count toward logged hours.`));
      }

      const tz = d.tzOffset === 'auto' ? 'the device’s time zone' : 'UTC' + (d.tzOffset >= 0 ? '+' : '') + d.tzOffset;
      const rules = node('ul', 'rules');
      for (const t of [
        `A day is in the quota when the AEXT working-days calendar${r.country ? ` (${r.country})` : ''} has it as working and you have no leave on it.`,
        ((d.ignoredStatuses || []).length ? `Leaves ${d.ignoredStatuses.join(' or ')} are ignored; pending` : 'Pending') +
          ' leaves are taken out like approved ones. Leave on a day off changes nothing.',
        'Logged is every hour AEXT has in the month, days off included.',
        'Today is due: until its hours are logged it counts as behind. A missing day is a working day before today with no hours.',
        `Days are in ${tz} (TZ_OFFSET_HOURS); today is ${shortDay(r.today)}.`,
      ]) rules.append(node('li', '', t));
      dbg.append(node('h3', '', 'Rules'), rules);
    }

    // The popup's month (YYYY-MM): the widget's at first ('' for this month until the first reply
    // says which it is), then any picked. Replies are kept by month and shown at once when picked
    // again, while the month loads anew.
    let popMonth = '', popToday = '', popSeq = 0, popIn = '', pickYear = 0, picker = null, popMinHeight = 0;
    const popCache = new Map();
    let dbgEl, bodyEl, monthBtn, monthLabel, stampEl, navBtns, thisChip, lastChip;

    function iconBtn(label, svg, onclick, cls) {
      const b = node('button', 'icon-btn' + (cls ? ' ' + cls : ''));
      b.type = 'button';
      b.title = label;
      b.setAttribute('aria-label', label);
      b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg>`;
      b.onclick = onclick;
      return b;
    }
    const backIcon = '<path d="M15 5l-7 7 7 7"/>', fwdIcon = '<path d="M9 5l7 7-7 7"/>';

    function chip(label, onclick) {
      const b = node('button', 'chip', label);
      b.type = 'button';
      b.onclick = onclick;
      return b;
    }

    function buildDebug() {
      dbgEl = document.body.appendChild(node('div', 'dbg'));
      const top = node('div', 'top');
      const nav = node('div', 'mnav');
      monthBtn = node('button', 'mbtn');
      monthBtn.type = 'button';
      monthBtn.title = 'Pick a month';
      monthBtn.setAttribute('aria-haspopup', 'dialog');
      monthBtn.setAttribute('aria-expanded', 'false');
      monthLabel = node('span');
      monthBtn.append(monthLabel);
      monthBtn.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>');
      monthBtn.onclick = () => (picker ? closePicker() : openPicker());
      navBtns = [
        iconBtn('Previous month', backIcon, () => pickMonth(addMonths(popMonth, -1)), 'back'),
        iconBtn('Next month', fwdIcon, () => pickMonth(addMonths(popMonth, 1)), 'fwd'),
      ];
      nav.append(navBtns[0], monthBtn, navBtns[1]);
      thisChip = chip('This month', () => pickMonth(popToday));
      lastChip = chip('Last month', () => pickMonth(addMonths(popToday, -1)));
      const chips = node('div', 'chips');
      chips.append(thisChip, lastChip);
      stampEl = node('span', 'stamp');
      const reload = iconBtn('Reload', '<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>', () => loadDebug());
      reload.id = 'reload';
      top.append(nav, chips, stampEl, reload, node('div', 'progress'));
      bodyEl = node('div', 'body');
      dbgEl.append(top, bodyEl);

      document.addEventListener('pointerdown', e => {
        if (picker && !picker.contains(e.target) && !monthBtn.contains(e.target)) closePicker();
      });
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape' || !picker) return;
        e.preventDefault(); // closes the picker, not the popup
        closePicker();
        monthBtn.focus();
      });
      updateTop();
    }

    // updateTop shows the month picked; until the first reply says what this month is, it waits.
    function updateTop() {
      const known = !!popToday && !!popMonth;
      monthLabel.textContent = popMonth ? monthName(popMonth) : 'Loading…';
      monthBtn.disabled = !known;
      for (const b of [...navBtns, thisChip, lastChip]) b.disabled = !known;
      thisChip.setAttribute('aria-pressed', String(known && popMonth === popToday));
      lastChip.setAttribute('aria-pressed', String(known && popMonth === addMonths(popToday, -1)));
    }

    function pickMonth(m) {
      closePicker();
      if (!m || m === popMonth) return;
      popIn = m > popMonth ? 'in-next' : 'in-prev';
      popMonth = m;
      updateTop();
      const r = popCache.get(m);
      if (r) renderDebug(r);
      loadDebug();
    }

    function openPicker() {
      pickYear = +popMonth.slice(0, 4);
      picker = node('div', 'picker');
      picker.setAttribute('role', 'dialog');
      picker.setAttribute('aria-label', 'Pick a month');
      const yr = node('div', 'yr');
      const year = node('span');
      const grid = node('div', 'grid');
      const draw = () => {
        year.textContent = String(pickYear);
        grid.textContent = '';
        for (let i = 0; i < 12; i++) {
          const ym = pickYear + '-' + String(i + 1).padStart(2, '0');
          const b = node('button', 'm' + (ym === popToday ? ' now' : ''), new Date(pickYear, i, 1).toLocaleString('en', { month: 'short' }));
          b.type = 'button';
          b.setAttribute('aria-selected', String(ym === popMonth));
          if (ym === popToday) b.title = 'This month';
          b.onclick = () => pickMonth(ym);
          grid.append(b);
        }
      };
      yr.append(iconBtn('Previous year', backIcon, () => (pickYear--, draw()), 'back'), year,
        iconBtn('Next year', fwdIcon, () => (pickYear++, draw()), 'fwd'));
      picker.append(yr, grid);
      draw();
      dbgEl.querySelector('.top').append(picker);
      monthBtn.setAttribute('aria-expanded', 'true');
      (grid.querySelector('[aria-selected="true"]') || grid.firstChild).focus();
    }

    function closePicker() {
      if (!picker) return;
      picker.remove();
      picker = null;
      monthBtn.setAttribute('aria-expanded', 'false');
    }

    // skeletonDebug stands in for the first month while it loads, about as tall as it will be.
    function skeletonDebug() {
      bodyEl.textContent = '';
      const sk = (w, hgt) => {
        const e = node('span', 'sk');
        e.style.width = w;
        if (hgt) e.style.height = hgt + 'px';
        return e;
      };
      const cal = node('div', 'cal');
      for (const w of weekdayNames) cal.append(node('div', 'wd', w));
      for (let i = 0; i < 42; i++) cal.append(sk('auto'));
      const legend = node('div', 'legend');
      legend.append(sk('110px', 12), sk('90px', 12), sk('70px', 12), sk('80px', 12));
      const sums = [0, 1, 2].map(() => {
        const s = node('div', 'sum');
        s.append(sk('90px', 42), sk('90px', 42), sk('90px', 42));
        return s;
      });
      bodyEl.append(cal, legend, ...sums);
    }

    async function loadDebug() {
      const n = ++popSeq, month = popMonth;
      dbgEl.classList.add('loading');
      if (!bodyEl.childElementCount) skeletonDebug();
      try {
        const r = await aex.call('quota', month ? { month, debug: true } : { debug: true });
        r.loadedAt = new Date();
        if (!r.needLogin) popCache.set(r.months[0].month, r);
        if (n !== popSeq) return;
        if (!r.needLogin) {
          popToday = r.today.slice(0, 7);
          popMonth = r.months[0].month;
        }
        renderDebug(r);
      } catch (e) {
        if (n !== popSeq) return;
        bodyEl.textContent = '';
        bodyEl.append(node('div', 'notice', 'Could not load the quota: ' + e.message));
      } finally {
        if (n === popSeq) {
          dbgEl.classList.remove('loading');
          updateTop();
        }
      }
    }

    function kv(pairs) {
      const dl = node('dl', 'kv');
      for (const [k, v] of pairs) dl.append(node('dt', '', k), node('dd', '', typeof v === 'string' ? v : JSON.stringify(v)));
      return dl;
    }

    function table(head, rows) {
      const t = node('table');
      const tr = node('tr');
      for (const h of head) tr.append(node('th', '', h));
      t.append(tr);
      for (const { cls, cells } of rows) {
        const row = node('tr', cls);
        for (const c of cells) row.append(node('td', '', c == null ? '' : String(c)));
        t.append(row);
      }
      return t;
    }

    // renderDebug draws reply r under the month selector, sliding in from the side it was picked on.
    function renderDebug(r) {
      let dbg = bodyEl;
      dbg.textContent = '';
      dbg.classList.remove('in-next', 'in-prev');
      if (popIn) {
        void dbg.offsetWidth; // restarts the animation
        dbg.classList.add(popIn);
        popIn = '';
      }
      stampEl.textContent = 'Loaded ' + r.loadedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (r.needLogin) return dbg.append(node('div', 'notice', 'Not logged in to AEXT.'));
      const d = r.debug;
      if (!d) return dbg.append(node('div', 'notice', 'AEXT sent nothing to explain.'));
      const raw = d.raw;
      warnHours = r.warnHours ?? 1;
      explain(dbg, r, r.months[0]);
      // The popup only grows from month to month (a past month has fewer sums than this one).
      dbg.style.minHeight = '';
      popMinHeight = Math.max(popMinHeight, dbg.offsetHeight);
      dbg.style.minHeight = popMinHeight + 'px';

      const details = node('details', 'more');
      const more = node('div');
      details.open = moreOpen;
      details.ontoggle = () => (moreOpen = details.open);
      details.append(node('summary', '', 'Details'), more);
      dbg.append(details);
      dbg = more;

      dbg.append(node('h3', '', 'Inputs'), kv([
        ['today', r.today], ['now', d.now], ['device', d.device], ['TZ_OFFSET_HOURS', d.tzOffset],
        ['country', r.country], ['HOURS_PER_DAY', r.hoursPerDay], ['QUOTA_WARN_HOURS', r.warnHours],
        ['ignored statuses', d.ignoredStatuses], ['fetched', raw.from + ' – ' + raw.to],
        ['took', d.took + ' (' + Object.entries(raw.took || {}).map(([k, v]) => k + ' ' + v).join(', ') + ')'],
        ['AEXT rows', `${(raw.workingDays || []).length} days, ${(raw.summary || []).length} summary, ${(raw.leaves || []).length} leaves`],
      ]));

      // Both months' numbers side by side: every field but the days.
      const cols = node('div', 'cols');
      for (const q of r.months) {
        const box = node('div');
        box.append(node('h3', '', monthName(q.month)), kv(Object.entries(q).filter(([k]) => k !== 'days')));
        cols.append(box);
      }
      dbg.append(cols);

      // Every day of both months: what AEXT said and what the quota made of it.
      const calendar = new Map((raw.workingDays || []).map(w => [w.date, w.is_working_day]));
      const summary = new Map();
      for (const s of raw.summary || []) summary.set(s.date, (summary.get(s.date) || 0) + s.hours_total);
      const missing = new Set(r.months.flatMap(q => q.missing || []));
      const days = [...r.months].reverse().flatMap(q => q.days || []);
      dbg.append(node('h3', '', 'Days'), table(
        ['date', 'day', 'calendar', 'kind', 'leave', 'quota', 'summary', 'hours', 'flags'],
        days.map(day => {
          const flags = [];
          if (day.date === r.today) flags.push('today');
          if (missing.has(day.date)) flags.push('missing');
          if (day.hours && day.kind !== 'work') flags.push('off-time hours');
          if (!calendar.has(day.date)) flags.push('not in calendar');
          const cal = calendar.get(day.date);
          return {
            cls: day.kind + (day.date === r.today ? ' today' : ''),
            cells: [day.date, dayOf(day.date).toLocaleString('en', { weekday: 'short' }),
              cal == null ? '—' : cal ? 'working' : 'off', day.kind,
              day.leave ? (day.leave.type || '?') + (day.leave.approved ? '' : ' (pending)') : '',
              d.workingDays[day.date] ? 'counted' : '', summary.has(day.date) ? summary.get(day.date) : '',
              day.hours ? h(day.hours) : '', flags.join(', ')],
          };
        })));

      const ignored = new Set(d.ignoredStatuses || []);
      dbg.append(node('h3', '', 'Leaves'), (raw.leaves || []).length ? table(
        ['id', 'type', 'start', 'end', 'status', 'user', 'created by'],
        raw.leaves.map(l => ({
          cls: ignored.has(l.status) ? 'ignored' : '',
          cells: [JSON.stringify(l.id), l.leave_type, l.start, l.end, l.status, l.user?.email, l.created?.user?.email],
        }))) : node('div', 'muted', 'none'));

      if ((r.warnings || []).length) {
        const list = node('ul');
        for (const w of r.warnings) list.append(node('li', 'flag', w));
        dbg.append(node('h3', '', 'Warnings'), list);
      }

      const json = node('details');
      json.append(node('summary', '', 'Raw reply'), node('pre', '', JSON.stringify(r, null, 2)));
      dbg.append(json);
    }

    if (aex.popup) {
      document.querySelector('.head').hidden = true;
      content.hidden = true;
      popMonth = aex.popup.data.month || '';
      buildDebug();
      aex.onRefresh(() => loadDebug());
      loadDebug();
    } else {
      prevBtn.onclick = () => go(offset - 1);
      nextBtn.onclick = () => go(offset + 1);
      nowBtn.onclick = () => go(0);
      document.getElementById('refresh').onclick = () => {
        load();
        loadCheck(true);
      };
      aex.onRefresh(() => {
        load();
        loadCheck(false);
      });
      load();
      loadCheck(false);
    }
  </script>
</body>
</html>
