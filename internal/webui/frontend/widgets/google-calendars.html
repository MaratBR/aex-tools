<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Calendar</title>
  <style>
    body { --cal: var(--accent); display: flex; flex-direction: column; padding: 14px 16px 14px; gap: 10px; }
    .head { display: flex; align-items: center; gap: 8px; }
    .title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .title .text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title .muted { font-weight: 400; }
    .loading #refresh svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }

    .list { flex: 1; min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; font-size: 13px; }
    .picks > * + * { box-shadow: inset 0 .5px 0 var(--sep); }

    /* The events: on now first, as tinted cards in the calendar's color (--cal) with the time left,
       then the upcoming ones by day, one line each with their start and length. */
    .section { display: flex; align-items: baseline; gap: 6px; padding: 6px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .section:first-child { padding-top: 0; }
    .section .live { width: 7px; height: 7px; border-radius: 50%; background: var(--cal); align-self: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .event { display: flex; align-items: center; gap: 8px; margin: 2px 0; padding: 3px 8px 3px 0; border-radius: 6px; overflow: hidden; }
    .event .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event .start { flex: none; min-width: 3.4em; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .event .long { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .event .bar { flex: none; align-self: stretch; width: 3px; border-radius: 0 3px 3px 0; background: var(--cal); }
    .event.tentative .bar { background: repeating-linear-gradient(var(--cal) 0 3px, transparent 3px 6px); }
    .event.now { margin: 3px 0; padding: 6px 10px 6px 0; border-radius: 8px; background: color-mix(in srgb, var(--cal) 16%, transparent); }
    .event.now .name { font-weight: 600; font-size: 14px; }
    .event .when { flex: none; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.25; }
    .event .left { font: 600 16px/1.2 var(--display); letter-spacing: -.01em; }
    .event .ends { color: var(--muted); font-size: 12px; }
    .event.soon { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--cal) 55%, transparent); }
    .event.soon .start { color: var(--cal); font-weight: 600; }
    .event.free .name, .event.free .long, .event.free .left { font-weight: 400; color: var(--muted); }
    .event.free.now { background: var(--fill); }
    .event.free .bar { background: var(--muted); opacity: .4; }
    .quiet { padding: 2px 0; font-size: 13px; font-weight: 600; color: var(--ok); }
    .quiet.muted { font-weight: 400; color: var(--muted); }
    .nothing { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .nothing .big { font: 600 20px/1.2 var(--display); letter-spacing: -.02em; color: var(--ok); }
    .nothing .muted { font-size: 13px; }

    /* Picking the calendar. */
    .pick-head { font-size: 13px; color: var(--muted); }
    .pick { width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; }
    .pick:hover { background: var(--hover); }
    .pick .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick.current .name { font-weight: 600; }
    .tag { flex: none; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
    .actions { display: flex; gap: 6px; }

    /* The filter: a regular expression over event titles. */
    .filter { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .filter input[type=text] { width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; font: 13px var(--mono); color: var(--ink); background: var(--fill); box-shadow: inset 0 0 0 .5px var(--sep); }
    .filter input[type=text]:focus { outline: none; box-shadow: var(--ring); }
    .filter label { display: flex; align-items: center; gap: 6px; }
    .filter input[type=radio] { margin: 0; accent-color: var(--accent); }
    .filter .modes { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .filter .error { color: var(--fail); font-size: 12px; overflow-wrap: anywhere; }
    .filter .error:empty { display: none; }
    #filter.on { color: var(--accent); }

    .notice { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 13px; }
    .notice .error { color: var(--fail); overflow-wrap: anywhere; max-height: 5.5em; overflow: hidden; }

    @media (max-height: 200px) {
      body { gap: 6px; padding-top: 12px; }
      .event, .event.now { padding-top: 3px; padding-bottom: 3px; }
      .event .note { display: none; }
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="title"><span class="dot" id="dot" hidden></span><span class="text" id="title">Google Calendar</span></div>
    <button class="icon-btn" id="filter" type="button" title="Filter events" aria-label="Filter events" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg>
    </button>
    <button class="icon-btn" id="change" type="button" title="Change calendar" aria-label="Change calendar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <button class="icon-btn" id="refresh" type="button" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
  <div id="content"></div>

  <script>
    // What is on now in one Google calendar and when each event ends, then what comes until the end
    // of the third working day after today (home.go: googleNowAPI). The
    // calendar is picked the first time (home.go: googleCalendarsAPI) and kept in this placement's
    // settings (aex.settings.calendar), so each copy of the widget can show another one. Each copy can
    // also filter the events by a regular expression over their titles (aex.settings.filter, ignoring
    // case), showing only the ones that match or hiding them (aex.settings.filterMode: "only", "hide").
    const content = document.getElementById('content');
    const titleEl = document.getElementById('title'), dotEl = document.getElementById('dot');
    const changeBtn = document.getElementById('change'), filterBtn = document.getElementById('filter');

    function node(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function setTitle(name, color) {
      titleEl.textContent = name || 'Google Calendar';
      dotEl.hidden = !name;
      const ok = /^#[0-9a-f]{3,8}$/i.test(color || '');
      dotEl.style.background = ok ? color : '';
      // --cal tints the events: the accent when the calendar has no color.
      if (ok) document.body.style.setProperty('--cal', color);
      else document.body.style.removeProperty('--cal');
    }

    // Dates and times -------------------------------------------------------------------------

    const localDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const parseDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); // YYYY-MM-DD, local
    const pad = n => String(n).padStart(2, '0');
    const monthDay = d => d.toLocaleString('en', { month: 'short', day: 'numeric' }); // Oct 1
    const shortDay = d => d.toLocaleString('en', { weekday: 'short' }) + ' ' + monthDay(d);
    const clock = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const sameDay = (a, b) => localDay(a).getTime() === localDay(b).getTime();

    // endOf is when an event ends: an all-day one at the start of its end date (the day after).
    const endOf = e => (e.allDay ? parseDate(e.end) : new Date(e.end));
    const startOf = e => (e.allDay ? parseDate(e.start) : new Date(e.start));

    function left(ms) {
      const min = Math.max(1, Math.ceil(ms / 60000));
      if (min < 60) return min + ' min left';
      const h = Math.floor(min / 60), m = min % 60;
      if (h < 24) return h + 'h' + (m ? ' ' + m + 'm' : '') + ' left';
      const days = Math.round(h / 24);
      return days + (days === 1 ? ' day left' : ' days left');
    }

    // until is when the event ends, as short as it can be said.
    function until(e, now) {
      const end = endOf(e);
      if (e.allDay) {
        const last = new Date(end.getTime() - 86400000);
        return sameDay(last, now) ? 'all day' : 'until ' + shortDay(last);
      }
      return 'until ' + (sameDay(end, now) ? clock(end) : shortDay(end) + ' ' + clock(end));
    }

    // inTime is how long until an event starts, for the ones starting within SOON.
    function inTime(ms) {
      const min = Math.max(1, Math.ceil(ms / 60000));
      if (min < 60) return 'in ' + min + ' min';
      const h = Math.floor(min / 60), m = min % 60;
      return 'in ' + h + 'h' + (m ? ' ' + m + 'm' : '');
    }

    // dayLabel names the day upcoming events are on.
    function dayLabel(d, now) {
      const days = Math.round((localDay(d) - localDay(now)) / 86400000);
      if (days === 0) return 'Later today';
      if (days === 1) return 'Tomorrow';
      return d.toLocaleString('en', { weekday: 'long' }) + ', ' + monthDay(d);
    }

    // duration is how long an event lasts: 45 min, 1h 30m, 2 days.
    function duration(e) {
      const ms = endOf(e) - startOf(e);
      if (e.allDay) {
        const days = Math.round(ms / 86400000);
        return days === 1 ? 'all day' : days + ' days';
      }
      const min = Math.round(ms / 60000);
      if (min < 60) return min + ' min';
      const h = Math.floor(min / 60), m = min % 60;
      return h + 'h' + (m ? ' ' + m + 'm' : '');
    }

    // Filter ----------------------------------------------------------------------------------

    // filterRe is the filter's regular expression, null when there is none (or it does not compile).
    function filterRe() {
      const f = aex.settings.filter;
      if (!f) return null;
      try { return new RegExp(f, 'i'); } catch { return null; }
    }

    function shown(e) {
      const re = filterRe();
      if (!re) return true;
      return re.test(e.title || '') === (aex.settings.filterMode !== 'hide');
    }

    // markFilter tints the filter button while a filter is on, and says which in its tooltip.
    function markFilter() {
      const on = !!filterRe();
      filterBtn.classList.toggle('on', on);
      filterBtn.title = on
        ? 'Filter: ' + (aex.settings.filterMode === 'hide' ? 'hiding' : 'only') + ' /' + aex.settings.filter + '/'
        : 'Filter events';
    }

    // editFilter asks for the filter, checking it compiles before keeping it.
    function editFilter() {
      ++seq;
      picking = 'filter';
      changeBtn.hidden = filterBtn.hidden = true;
      document.body.classList.remove('loading');
      content.className = 'filter';
      content.textContent = '';
      content.style.display = '';
      const box = node('input');
      box.type = 'text';
      box.placeholder = 'e.g. standup|1:1';
      box.value = aex.settings.filter || '';
      box.spellcheck = false;
      const modes = node('div', 'modes');
      const mode = aex.settings.filterMode === 'hide' ? 'hide' : 'only';
      const radios = [['only', 'Show only matching'], ['hide', 'Hide matching']].map(([v, text]) => {
        const l = node('label'), b = node('input');
        b.type = 'radio';
        b.name = 'mode';
        b.value = v;
        b.checked = v === mode;
        l.append(b, node('span', null, text));
        modes.append(l);
        return b;
      });
      const error = node('div', 'error');
      const row = node('div', 'actions');
      const save = node('button', 'btn primary', 'Save'), clear = node('button', 'btn', 'Clear'), cancel = node('button', 'btn', 'Cancel');
      [save, clear, cancel].forEach(b => { b.type = 'button'; row.append(b); });
      content.append(node('div', 'muted', 'Filter events by title: a regular expression, ignoring case'), box, modes, error, row);
      box.focus();

      const done = () => {
        picking = false;
        markFilter();
        if (reply) renderNow();
        load();
      };
      async function keep(filter, filterMode) {
        try {
          await aex.saveSettings({ ...aex.settings, filter, filterMode });
        } catch (e) {
          error.textContent = 'Could not keep the filter: ' + e.message;
          return;
        }
        done();
      }
      save.onclick = () => {
        const f = box.value.trim();
        if (f) {
          try { new RegExp(f, 'i'); } catch (e) { error.textContent = e.message; return; }
        }
        keep(f, radios.find(b => b.checked).value);
      };
      clear.onclick = () => keep('', mode);
      cancel.onclick = done;
      box.onkeydown = ev => {
        if (ev.key === 'Enter') save.onclick();
        else if (ev.key === 'Escape') done();
      };
    }

    // Views -----------------------------------------------------------------------------------

    let reply = null; // the last googleNow reply, counted down between loads
    const SOON = 15 * 60000; // an event starting within this is outlined

    // eventRow is one event: its bar in the calendar's color, then before (or nothing), its name and
    // the rest.
    function eventRow(e, cls, title, before, ...rest) {
      const li = node('div', 'event' + (cls ? ' ' + cls : '') + (e.free ? ' free' : '') + (e.tentative ? ' tentative' : ''));
      const name = node('span', 'name', e.title || '(no title)');
      li.append(node('span', 'bar'), ...(before ? [before] : []), name, ...rest);
      const marks = [e.tentative && 'tentative', e.free && 'free'].filter(Boolean);
      li.title = (e.title || '(no title)') + '\n' + title + (marks.length ? '\n' + marks.join(', ') : '');
      return li;
    }

    function section(text, live) {
      const s = node('div', 'section');
      if (live) s.append(node('span', 'live'));
      s.append(node('span', null, text));
      return s;
    }

    // span is when an event is, for its tooltip: Wed Sep 30 10:00–11:30 (1h 30m).
    function span(e) {
      const start = startOf(e), end = endOf(e);
      if (e.allDay) {
        const last = new Date(end.getTime() - 86400000);
        return shortDay(start) + (sameDay(last, start) ? '' : ' – ' + shortDay(last)) + ' (' + duration(e) + ')';
      }
      return shortDay(start) + ' ' + clock(start) + '–' + (sameDay(end, start) ? '' : shortDay(end) + ' ') + clock(end) + ' (' + duration(e) + ')';
    }

    function renderNow() {
      const now = new Date();
      content.className = 'list';
      content.textContent = '';
      content.style.display = '';
      // Events move from upcoming to now as they start, between loads.
      const all = reply.events.concat(reply.upcoming || []).filter(e => endOf(e) > now && shown(e));
      const on = all.filter(e => startOf(e) <= now), next = all.filter(e => startOf(e) > now);

      // On now: how long until it ends, then when it ends.
      if (on.length) {
        content.append(section('Now', true));
        for (const e of on) {
          const when = node('div', 'when');
          // An all-day event ending today: "all day" when it is only today, else "last day".
          const endsToday = e.allDay && sameDay(new Date(endOf(e).getTime() - 86400000), now);
          const lastDay = endsToday && !sameDay(startOf(e), now);
          when.append(node('div', 'left', lastDay ? 'last day' : endsToday ? 'all day' : left(endOf(e) - now)));
          if (!endsToday) when.append(node('div', 'ends', until(e, now)));
          content.append(eventRow(e, 'now', span(e), null, when));
        }
      } else {
        content.append(node('div', 'quiet', 'Nothing on now' + (filterRe() ? ' (filtered)' : '')));
      }

      // Upcoming: when it starts, and how long it is.
      let day = null;
      for (const e of next) {
        const start = startOf(e);
        if (!day || !sameDay(day, start)) {
          day = start;
          content.append(section(dayLabel(start, now)));
        }
        const soon = !e.allDay && start - now <= SOON;
        const at = node('span', 'start', e.allDay ? '' : soon ? inTime(start - now) : clock(start));
        content.append(eventRow(e, soon ? 'soon' : '', span(e), at, node('span', 'long', duration(e))));
      }
      if (!next.length) {
        content.append(node('div', 'quiet muted', 'Nothing else' + (filterRe() ? ' matching the filter' : '') + (reply.until ? ' through ' + shortDay(parseDate(reply.until)) : '') + '.'));
      }
    }

    function notice(text, error, ...actions) {
      content.textContent = '';
      content.style.display = '';
      content.className = 'notice';
      content.append(node('div', null, text));
      if (error) content.append(node('div', 'error', error));
      if (actions.length) {
        const row = node('div', 'actions');
        actions.forEach((a, i) => {
          const b = node('button', i ? 'btn' : 'btn primary', a.label);
          b.type = 'button';
          b.onclick = a.run;
          row.append(b);
        });
        content.append(row);
      }
    }

    const login = { label: 'Log in', run: () => aex.run('account --login google') };

    // problem shows why a reply has no events (no client, no login, no Calendar access); false when
    // there is none.
    function problem(r) {
      if (r.notConfigured) notice('No Google OAuth client set.', 'Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Settings.');
      else if (r.needLogin) notice('Not logged in to Google.', '', login);
      else if (r.noCalendar) notice(`Logged in as ${r.email}, without Calendar access.`, '', { label: 'Log in again', run: login.run });
      else return false;
      return true;
    }

    // pick lists the account's calendars to choose the one to show.
    async function pick() {
      const n = ++seq;
      picking = 'calendar';
      changeBtn.hidden = filterBtn.hidden = true;
      document.body.classList.add('loading');
      notice('Loading calendars…');
      try {
        const r = await aex.call('googleCalendars');
        if (n !== seq) return;
        if (problem(r)) return;
        const current = aex.settings.calendar;
        content.className = 'list picks';
        content.textContent = '';
        content.append(node('div', 'pick-head', 'Pick the calendar to show (' + r.email + ')'));
        for (const cal of r.calendars) {
          const li = node('div');
          const b = node('button', 'pick' + (cal.id === current ? ' current' : ''));
          b.type = 'button';
          const dot = node('span', 'dot');
          if (/^#[0-9a-f]{3,8}$/i.test(cal.color || '')) dot.style.background = cal.color;
          b.append(dot, node('span', 'name', cal.name));
          if (cal.primary) b.append(node('span', 'tag', 'primary'));
          b.title = cal.name;
          b.onclick = () => choose(cal);
          li.append(b);
          content.append(li);
        }
        if (current) {
          const li = node('div');
          const cancel = node('button', 'btn', 'Cancel');
          cancel.type = 'button';
          cancel.style.marginTop = '6px';
          cancel.onclick = () => { picking = false; load(); };
          li.append(cancel);
          content.append(li);
        }
      } catch (e) {
        if (n !== seq) return;
        notice('Could not list the calendars.', e.message, { label: 'Try again', run: pick });
      } finally {
        if (n === seq) document.body.classList.remove('loading');
      }
    }

    async function choose(cal) {
      try {
        await aex.saveSettings({ ...aex.settings, calendar: cal.id, name: cal.name });
      } catch (e) {
        return notice('Could not keep the calendar.', e.message, { label: 'Try again', run: () => choose(cal) });
      }
      picking = false;
      reply = null;
      setTitle(cal.name, cal.color);
      load();
    }

    // Loading ---------------------------------------------------------------------------------

    let seq = 0, picking = false;
    async function load() {
      const id = aex.settings.calendar;
      if (!id) return pick();
      if (picking) return;
      const n = ++seq;
      document.body.classList.add('loading');
      if (!reply) {
        setTitle(aex.settings.name);
        notice('Loading…');
      }
      try {
        const r = await aex.call('googleNow', { calendar: id });
        if (n !== seq) return;
        changeBtn.hidden = filterBtn.hidden = false;
        if (problem(r)) {
          reply = null;
        } else if (r.missing) {
          reply = null;
          notice(`The calendar “${aex.settings.name || id}” is no longer in ${r.email}’s calendars.`, '', { label: 'Pick another', run: pick });
        } else {
          reply = r;
          setTitle(r.calendar.name, r.calendar.color);
          if (r.calendar.name !== aex.settings.name) aex.saveSettings({ ...aex.settings, name: r.calendar.name }).catch(() => {});
          renderNow();
        }
      } catch (e) {
        if (n !== seq) return;
        reply = null;
        changeBtn.hidden = filterBtn.hidden = false;
        notice('Could not reach Google Calendar.', e.message, { label: 'Try again', run: load });
      } finally {
        if (n === seq) document.body.classList.remove('loading');
      }
    }

    // Google is asked again on each refresh (auto refresh: every minute, home.go); between loads the
    // times count down.
    setInterval(() => {
      if (reply && !picking) renderNow();
    }, 30000);

    changeBtn.onclick = pick;
    filterBtn.onclick = editFilter;
    markFilter();
    document.getElementById('refresh').onclick = () => (picking === 'filter' ? null : picking ? pick() : load());
    aex.onRefresh(() => (picking ? null : load()));
    load();
  </script>
</body>
</html>
